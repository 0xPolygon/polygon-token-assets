name: Assets Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        required: false
        type: choice
        description: "Environment to deploy to"
        options:
          - prod

jobs:
  deploy:
    uses: ./.github/workflows/build_and_deploy.yml
    with:
      environment: ${{ inputs.environment || 'prod' }}
    secrets: inherit
